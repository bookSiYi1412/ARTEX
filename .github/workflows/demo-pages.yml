name: Deploy ARTEX demo to GitHub Pages

on:
  push:
    branches: [demo]
    paths:
      - "web/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy ARTEX demo to GitHub Pages"]
    types: [completed]
    branches: [demo]

permissions:
  contents: read

concurrency:
  group: artex-demo-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Build static demo with mock data
        run: npm run build:demo
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    # Pages environment allows main to publish; demo pushes only validate the build.
    # Their successful workflow_run event starts the publishing run on main.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
